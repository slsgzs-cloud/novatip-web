name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      # @novatip/sdk is resolved as `file:../novatip-sdk`, so the SDK has to sit
      # beside this repo in the workspace and be built before npm can link it.
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          path: novatip-web

      - name: Checkout sdk
        uses: actions/checkout@v4
        with:
          repository: Novatip/novatip-sdk
          ref: main
          path: novatip-sdk

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            novatip-web/package-lock.json
            novatip-sdk/package-lock.json

      - name: Build sdk
        working-directory: novatip-sdk
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: novatip-web
        run: npm ci

      - name: Lint
        working-directory: novatip-web
        run: npm run lint

      - name: Typecheck
        working-directory: novatip-web
        run: npm run typecheck

      - name: Test
        working-directory: novatip-web
        run: npm test

      - name: Build
        working-directory: novatip-web
        run: npm run build
        env:
          # Stub values so lib/config.ts's fail-fast validation passes. The
          # contract id only has to be shaped like one — nothing is dialled.
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_SITE_URL: https://novatip.xyz
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_TIP_SPLITTER_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD2KM
          NEXT_PUBLIC_USDC_CONTRACT_ID: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA
